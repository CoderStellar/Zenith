  method: giovanni
  cadence: monthly
  domain: land

snow_water:
  name: Water stored in snow (snow water equivalent)
  instrument: GLDAS Noah (model)
  short_name: GLDAS_NOAH025_M
  version: "2.1"
  variable: SWE_inst
  giovanni_id: GLDAS_NOAH025_M_2_1_SWE_inst
  units: kg m-2
  method: giovanni
  cadence: monthly
  domain: land
  note: "kg/m2 equals mm of water."
