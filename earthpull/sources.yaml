  short_name: M2TMNXSLV
  version: "5.12.4"
  variable: U850
  units: m/s
  method: harmony
  cadence: monthly
  domain: global
  event_only: true

wind_v850:
  name: Northward wind at 850 hPa (about 1.5 km up)
  instrument: MERRA-2 (model)
  short_name: M2TMNXSLV
  version: "5.12.4"
  variable: V850
  units: m/s
  method: harmony
  cadence: monthly
  domain: global
  event_only: true

aod_modis_aqua:
